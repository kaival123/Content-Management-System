# Production deploy: the CMS behind Caddy (automatic HTTPS).
# Data (user sites + SQLite) persists in the named volume `cms-data`.
#
#   1. Put your real values in a .env file next to this (see .env.example).
#   2. Edit Caddyfile with your domain.
#   3. docker compose up -d --build

services:
  cms:
    # Local/VPS: `docker compose up -d --build` builds this and tags it as the image below.
    # Jenkins/registry: set CMS_IMAGE to the pushed tag and `docker compose pull cms`.
    image: ${CMS_IMAGE:-landing-cms:latest}
    build: .
    environment:
      # Public hostname the CMS is served at (defeats DNS-rebinding; must match Caddy's site).
      CMS_ALLOWED_HOSTS: ${CMS_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - cms-data:/data          # user websites + cms.db live here, across redeploys
    restart: unless-stopped
    # Note: the CMS port is NOT published to the host — only Caddy can reach it.

  caddy:
    image: caddy:2
    depends_on: [cms]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  cms-data:
  caddy-data:
  caddy-config:
