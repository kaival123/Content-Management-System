# Production deploy: the CMS behind Caddy (automatic HTTPS).
# Accounts + every user's websites persist in the `cms-data` volume across redeploys.
#
#   1. cp .env.example .env   and fill it in
#   2. edit Caddyfile with your domain
#   3. docker compose up -d --build
#
# Caddy terminates HTTPS and proxies to the cms container on the internal network;
# the cms port is NOT published to the host, so only Caddy can reach it.

services:
  cms:
    build: .
    image: landing-cms:latest
    environment:
      # Public hostname the CMS is served at (must equal the site label in Caddyfile).
      CMS_ALLOWED_HOSTS: ${CMS_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Served over HTTPS by Caddy → cookies must be Secure.
      CMS_SECURE_COOKIE: "1"
    volumes:
      - cms-data:/data          # SQLite + all users' website files live here
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [cms]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # issued TLS certs — must persist
      - caddy-config:/config
    restart: unless-stopped

volumes:
  cms-data:
  caddy-data:
  caddy-config:
