<header class="lp-head">
  <h2 class="lp-h2" data-el="heading" data-edit="heading" data-ph="Heading">{{heading}}</h2>
</header>
<div class="lp-grid" data-grid>
  {{#each items}}
  <figure class="lp-card lp-quote" data-el="card">
    <blockquote class="lp-pre" data-el="quote" data-edit="quote">{{quote}}</blockquote>
    <figcaption>
      {{#if avatar}}
      <img class="lp-avatar" data-el="avatar" src="{{avatar}}" alt="{{name}}" />
      {{else}}
      <span class="lp-avatar" data-el="avatar">{{initials name}}</span>
      {{/if}}
      <span>
        <strong data-el="name" data-edit="name">{{name}}</strong>
        <small data-el="role" data-edit="role">{{role}}</small>
      </span>
    </figcaption>
  </figure>
  {{/each}}
</div>
