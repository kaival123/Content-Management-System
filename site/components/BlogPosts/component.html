<header class="lp-head">
  <h2 class="lp-h2" data-el="heading" data-edit="heading" data-ph="Heading">{{heading}}</h2>
  {{#if subheading}}<p class="lp-lead lp-pre" data-el="subheading" data-edit="subheading">{{subheading}}</p>{{/if}}
</header>
<div class="lp-grid" data-grid>
  {{#each posts}}
  <article class="lp-card lp-post" data-el="card">
    {{#if image}}<img class="lp-post-cover" data-el="image" src="{{image}}" alt="" />{{/if}}
    <div class="lp-post-body">
      <span class="lp-post-meta">{{#if category}}<b>{{category}}</b> · {{/if}}{{date}}</span>
      <h3 class="lp-h3" data-el="title" data-edit="title">{{title}}</h3>
      <p class="lp-pre" data-el="excerpt" data-edit="excerpt">{{excerpt}}</p>
      <span class="lp-post-foot">
        {{#if author}}<small>By {{author}}</small>{{/if}}
        {{#if link}}<a class="lp-post-link" href="{{link}}">Read more →</a>{{/if}}
      </span>
    </div>
  </article>
  {{/each}}
</div>
