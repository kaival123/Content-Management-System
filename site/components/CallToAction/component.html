<div class="lp-cta-inner">
  <h2 class="lp-h2" data-el="heading" data-edit="heading" data-ph="Heading">{{heading}}</h2>
  {{#if text}}
  <p class="lp-lead lp-pre" data-el="text" data-edit="text">{{text}}</p>
  {{/if}}
  {{#if buttonLabel}}
  <a class="lp-btn lp-btn-primary" data-el="button" data-edit="buttonLabel" href="{{default buttonHref "#"}}">{{buttonLabel}}</a>
  {{/if}}
</div>
