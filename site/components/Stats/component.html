{{#if heading}}
<h2 class="lp-h2 lp-head" data-el="heading" data-edit="heading">{{heading}}</h2>
{{/if}}
<div class="lp-grid lp-stats" data-grid>
  {{#each items}}
  <div class="lp-card lp-stat" data-el="card">
    <div class="lp-stat-value" data-el="value" data-edit="value">{{value}}</div>
    <div class="lp-stat-label" data-el="label" data-edit="label">{{label}}</div>
  </div>
  {{/each}}
</div>
