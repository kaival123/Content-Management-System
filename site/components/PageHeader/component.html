<div class="lp-page-header">
  {{#if breadcrumb}}<span class="lp-crumbs" data-el="breadcrumb" data-edit="breadcrumb">{{breadcrumb}}</span>{{/if}}
  <h1 class="lp-h1" data-el="heading" data-edit="heading" data-ph="Page title">{{heading}}</h1>
  {{#if text}}<p class="lp-lead lp-pre" data-el="text" data-edit="text">{{text}}</p>{{/if}}
  {{#if buttonLabel}}<a class="lp-btn lp-btn-primary" data-el="button" data-edit="buttonLabel" href="{{buttonHref}}">{{buttonLabel}}</a>{{/if}}
</div>
