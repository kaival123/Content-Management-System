<div class="lp-newsletter">
  <h2 class="lp-h2" data-el="heading" data-edit="heading" data-ph="Heading">{{heading}}</h2>
  {{#if text}}<p class="lp-lead lp-pre" data-el="text" data-edit="text">{{text}}</p>{{/if}}
  <form class="lp-newsletter-form" data-el="form" data-form="contact" data-success="{{successMessage}}">
    <input name="email" type="email" required autocomplete="email" placeholder="{{placeholder}}" aria-label="Email address" />
    <button class="lp-btn lp-btn-primary" type="submit" data-el="button" data-edit="buttonLabel">{{buttonLabel}}</button>
  </form>
  {{#if note}}<small class="lp-muted">{{note}}</small>{{/if}}
</div>
